<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSales - Clientes</title>

    <link rel="stylesheet" href="css/estilo.css" />
</head>
<body class="pagina-clientes">

    <header class="topo">
        <a class="marca" href="/">
            <span class="marca-icone" aria-hidden="true">SS</span>
            StockSales
        </a>
        <nav class="menu">
            <a href="/">Início</a>
            <a href="/produtos.html">Produtos</a>
            <a href="/clientes.html" class="ativo">Clientes</a>
        </nav>
    </header>

    <main class="conteudo">
        <section class="cabecalho-pagina">
            <h1>Lista de clientes</h1>
            <p class="subtitulo">
                Cadastre um cliente e veja a lista atualizar pela API.
            </p>
        </section>

        <form id="form-cliente">
            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" placeholder="Ex.: Ana Silva" autocomplete="off" />
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input id="email" placeholder="Ex.: ana@email.com" autocomplete="off" />
            </div>
            <div class="campo campo-curto">
                <label for="telefone">Telefone</label>
                <input id="telefone" placeholder="Ex.: 1199" autocomplete="off" />
            </div>
            <button id="btn-cadastro" type="submit">Cadastrar</button>
        </form>

        <ul id="lista-clientes"></ul>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
