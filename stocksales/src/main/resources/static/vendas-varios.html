<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSales - Vários produtos</title>

    <link rel="stylesheet" href="css/estilo.css" />
</head>
<body class="pagina-varios">

    <header class="topo">
        <a class="marca" href="/">
            <span class="marca-icone" aria-hidden="true">SS</span>
            StockSales
        </a>
        <nav class="menu">
            <a href="/">Início</a>
            <a href="/produtos.html">Produtos</a>
            <a href="/clientes.html">Clientes</a>
            <a href="/vendas-nova.html">Nova venda</a>
            <a href="/vendas.html">Histórico</a>
            <a href="/vendas-varios.html" class="ativo">Vários produtos</a>
        </nav>
    </header>

    <main class="conteudo">
        <section class="cabecalho-pagina">
            <h1>Venda com vários produtos</h1>
            <p class="subtitulo">
                Um cliente e uma lista de produtos. Acrescente um a um e confirme.
            </p>
        </section>

        <form id="form-item">
            <div class="campo">
                <label for="clienteId">Cliente</label>
                <select id="clienteId"></select>
            </div>
            <div class="campo">
                <label for="produtoId">Produto</label>
                <select id="produtoId"></select>
            </div>
            <div class="campo campo-curto">
                <label for="quantidade">Quantidade</label>
                <input id="quantidade" type="number" min="1" step="1" value="1" />
            </div>
            <button id="btn-adicionar" type="submit">Adicionar produto</button>
        </form>

        <ul id="lista-itens"></ul>

        <div class="acoes">
            <button id="btn-confirmar" class="botao" type="button">Confirmar venda</button>
        </div>

        <p id="mensagem"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/vendas-varios.js"></script>
</body>
</html>
