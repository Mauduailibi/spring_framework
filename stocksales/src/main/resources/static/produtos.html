<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSales - Produtos</title>

    <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>

    <h1>Lista de produtos</h1>

    <a href="/">Voltar a tela inicial</a>

    <form id="form-produto">
        <input id="nome" placeholder="Nome do produto" />
        <input id="preco" placeholder="Preço do produto" type="number" />
        <input id="estoque" placeholder="Quantidade em estoque" type="number" />
        <button id="btn-cadastro" type="submit">Cadastrar</button>
    </form>

    <ul id="lista-produtos"></ul>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/produtos.js"></script>
</body>
</html>
