<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSales - Produtos</title>

    <link rel="stylesheet" href="css/estilo.css" />
</head>
<body class="pagina-produtos">

    <header class="topo">
        <a class="marca" href="/">
            <span class="marca-icone" aria-hidden="true">SS</span>
            StockSales
        </a>
        <nav class="menu">
            <a href="/">Início</a>
            <a href="/produtos.html" class="ativo">Produtos</a>
        </nav>
    </header>

    <main class="conteudo">
        <section class="cabecalho-pagina">
            <h1>Lista de produtos</h1>
            <p class="subtitulo">
                Cadastre um produto e veja a lista atualizar pela API.
            </p>
        </section>

        <form id="form-produto">
            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" placeholder="Ex.: Teclado mecânico" autocomplete="off" />
            </div>
            <div class="campo campo-curto">
                <label for="preco">Preço</label>
                <input id="preco" placeholder="0.00" type="number" min="0" step="0.01" />
            </div>
            <div class="campo campo-curto">
                <label for="estoque">Estoque</label>
                <input id="estoque" placeholder="0" type="number" min="0" step="1" />
            </div>
            <button id="btn-cadastro" type="submit">Cadastrar</button>
        </form>

        <ul id="lista-produtos"></ul>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/produtos.js"></script>
</body>
</html>
