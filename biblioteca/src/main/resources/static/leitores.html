<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Leitores</title>

    <link rel="stylesheet" href="css/estilo.css" />
</head>
<body class="pagina-leitores">

    <header class="topo">
        <a class="marca" href="/">
            <span class="marca-icone" aria-hidden="true">BB</span>
            Biblioteca
        </a>
        <nav class="menu">
            <a href="/">Início</a>
            <a href="/livros.html">Livros</a>
            <a href="/leitores.html" class="ativo">Leitores</a>
            <a href="/emprestimos-novo.html">Novo empréstimo</a>
            <a href="/emprestimos.html">Histórico</a>
            <a href="/emprestimos-varios.html">Vários livros</a>
        </nav>
    </header>

    <main class="conteudo">
        <section class="cabecalho-pagina">
            <h1>Lista de leitores</h1>
            <p class="subtitulo">
                Cadastre um leitor e veja a lista atualizar pela API.
            </p>
        </section>

        <form id="form-leitor">
            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" placeholder="Ex.: Maria Silva" autocomplete="off" />
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input id="email" placeholder="Ex.: maria@email.com" autocomplete="off" />
            </div>
            <div class="campo campo-curto">
                <label for="telefone">Telefone</label>
                <input id="telefone" placeholder="Ex.: 1191" autocomplete="off" />
            </div>
            <button id="btn-cadastro" type="submit">Cadastrar</button>
        </form>

        <ul id="lista-leitores"></ul>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/leitores.js"></script>
</body>
</html>
