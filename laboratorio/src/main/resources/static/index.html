<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio - Materiais</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>

    <h1>Cadastro de materiais</h1>

    <p class="subtitulo">
        Gerencie os materiais do laboratório utilizando requisições HTTP.
    </p>

    <form id="form-material">
        <input id="nome" type="text" placeholder="Nome">
        <input id="quantidade" type="number" placeholder="Quantidade">
        <select id="select-categoria"></select>
        <button type="submit">Cadastrar</button>
    </form>

    <p id="mensagem"></p>

    <ul id="lista-materiais"></ul>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
